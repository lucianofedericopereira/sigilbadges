name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  native:
    name: "Native runner Perl (no setup step)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Deliberately no "Set up Perl" step: this is the whole point.
      # GitHub-hosted runners ship a system Perl; there is nothing to
      # install, download, or pin.
      - name: Show interpreter
        run: perl -v

      - name: Syntax-check the script
        run: perl -c sigilbadges.pl

      - name: Run test suite (prove)
        run: prove -r t

  time-travel:
    name: "Perl ${{ matrix.perl }} (unmodified source, ${{ matrix.year }})"
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Starts at 5.10, not 5.8: sigilbadges.pl uses
          # File::Path::make_path (to create --badges-dir), which only
          # landed in File::Path 2.0, first bundled with Perl 5.10 — a 5.8
          # leg would fail on that import alone, before ever reaching the
          # test suite.
          - perl: "5.10"
            year: "~2008"
            image: "perl:5.10-buster"
          - perl: "5.14"
            year: "~2011"
            image: "perl:5.14-buster"
          - perl: "5.20"
            year: "~2014"
            image: "perl:5.20-buster"
          - perl: "5.26"
            year: "~2017"
            image: "perl:5.26-buster"
          - perl: "5.32"
            year: "~2020"
            image: "perl:5.32"
          - perl: "5.36"
            year: "~2022"
            image: "perl:5.36"
          - perl: "latest"
            year: "today"
            image: "perl:latest"
    steps:
      - uses: actions/checkout@v4

      - name: Show interpreter
        run: perl -v

      - name: Run test suite (prove)
        run: prove -r t

      - name: Exercise the CLI against a fixture
        run: |
          set -e
          dir=$(mktemp -d)
          printf '# Smoke\n\n<!--[[ badge: logo=php label="PHP" message="8.5" ]]-->...<!--/-->\n' > "$dir/README.md"
          perl sigilbadges.pl --file "$dir/README.md" --badges-dir "$dir/badges"
          grep -q 'badges/php.svg' "$dir/README.md"
          test -f "$dir/badges/php.svg"

  docs-fresh:
    name: "README badges are current (dogfooding)"
    runs-on: ubuntu-latest
    needs: native
    steps:
      - uses: actions/checkout@v4
      # Run this very action, from this very commit, against its own
      # README, in check mode (never commits). If a badge in the README
      # doesn't match the repo, this fails.
      - name: Verify README badges are current
        uses: ./
        with:
          file: "README.md"
          check: "true"
          commit: "false"

  tree-fresh:
    name: "README project-structure tree is current (dogfooding, via treegen2)"
    runs-on: ubuntu-latest
    needs: native
    steps:
      - uses: actions/checkout@v4
      # The README's "Project structure" section (color="github", matching
      # this project's own graphite branding rather than treegen2's default
      # green) is generated by treegen2's own action, not this repo's code —
      # check mode here just confirms nobody edited assets/sigilbadges-tree.svg
      # or the repo layout without re-running it.
      - name: Verify the README tree is current
        uses: lucianofedericopereira/treegen2@main
        with:
          readme: "README.md"
          check: "true"
          commit: "false"
